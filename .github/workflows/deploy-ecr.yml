# Construye la imagen de Docker del front (Dockerfile de la raíz) y la sube a AWS ECR
# en cada push a main o a frontend-ariadna. También se puede lanzar a mano desde Actions.
# Requiere en Settings → Secrets and variables → Actions:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# Las variables de Grafana (OTEL_*) NO van aquí: se configuran donde corre el contenedor.
name: Ariadna - construir y subir a ECR

on:
  push:
    branches: [main, frontend-ariadna]
  workflow_dispatch:

env:
  ECR_REPOSITORY: ariadna-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
